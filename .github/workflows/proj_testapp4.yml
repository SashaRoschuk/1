# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - testapp4

on:
  push:
    branches:
      - proj
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://mcr.microsoft.com/
        username: ${{ secrets.AzureAppService_ContainerUsername_aed5d251493a49da8891b3e2bef19918 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_dd3b4bab18c3496b9a783e04cc0a8c78 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: mcr.microsoft.com/${{ secrets.AzureAppService_ContainerUsername_aed5d251493a49da8891b3e2bef19918 }}/hipoint/app:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'testapp4'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_f7935bc58fef47159a6c88322f0cb90d }}
        images: 'mcr.microsoft.com/${{ secrets.AzureAppService_ContainerUsername_aed5d251493a49da8891b3e2bef19918 }}/hipoint/app:${{ github.sha }}'