# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - testapp4

on:
  push:
    branches:
      - proj
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_12edb2abec7947e6a03d3f833c87748f }}
        password: ${{ secrets.AzureAppService_ContainerPassword_69588973bdf8409e99fb9e56e2739b54 }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_12edb2abec7947e6a03d3f833c87748f }}/hipoint/app:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'testapp4'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_a5774b04d6814f1e846d7d27cfb8d3bd }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_12edb2abec7947e6a03d3f833c87748f }}/hipoint/app:${{ github.sha }}'